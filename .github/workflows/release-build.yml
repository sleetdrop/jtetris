name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: 1.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  standalone-jar:
    name: Standalone jar
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release version
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build standalone jar
        run: ./mvnw -Djava.awt.headless=true clean package

      - name: Stage standalone jar
        shell: bash
        run: |
          mkdir -p target/release
          cp "target/jtetris-${{ steps.release.outputs.version }}-standalone.jar" \
            "target/release/JTetris-${{ steps.release.outputs.version }}.jar"

      - name: Upload standalone jar
        uses: actions/upload-artifact@v4
        with:
          name: JTetris-${{ steps.release.outputs.version }}-jar
          path: target/release/JTetris-${{ steps.release.outputs.version }}.jar
          if-no-files-found: error

  native-app:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.preview }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon app
            runner: macos-15
            profile: mac
            artifact_suffix: macos-aarch64
            archive_command: macos
            preview: false
          - label: macOS Intel app
            runner: macos-15-intel
            profile: mac
            artifact_suffix: macos-x64
            archive_command: macos
            preview: false
          - label: Windows x64 app
            runner: windows-2025
            profile: windows
            artifact_suffix: windows-x64
            archive_command: windows
            preview: false
          - label: Windows arm64 app preview
            runner: windows-11-arm
            profile: windows
            artifact_suffix: windows-aarch64
            archive_command: windows
            preview: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release version
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build native app image
        shell: bash
        run: ./mvnw -Djava.awt.headless=true -P${{ matrix.profile }} clean package

      - name: Stage macOS archive
        if: matrix.archive_command == 'macos'
        shell: bash
        run: |
          mkdir -p target/release
          ditto -c -k --sequesterRsrc --keepParent target/dist/JTetris.app \
            "target/release/JTetris-${{ steps.release.outputs.version }}-${{ matrix.artifact_suffix }}.zip"

      - name: Stage Windows archive
        if: matrix.archive_command == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release
          Compress-Archive `
            -Path target/dist/JTetris `
            -DestinationPath "target/release/JTetris-${{ steps.release.outputs.version }}-${{ matrix.artifact_suffix }}.zip" `
            -Force

      - name: Upload native app archive
        uses: actions/upload-artifact@v4
        with:
          name: JTetris-${{ steps.release.outputs.version }}-${{ matrix.artifact_suffix }}
          path: target/release/JTetris-${{ steps.release.outputs.version }}-${{ matrix.artifact_suffix }}.zip
          if-no-files-found: error
