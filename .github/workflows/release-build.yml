name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        default: 1.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  standalone-jar:
    name: Standalone jar
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release version
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build standalone jar
        run: ./mvnw -Djava.awt.headless=true clean package

      - name: Stage standalone jar
        shell: bash
        run: |
          mkdir -p target/release
          cp "target/jtetris-${{ steps.release.outputs.version }}-standalone.jar" \
            "target/release/JTetris-${{ steps.release.outputs.version }}.jar"

      - name: Upload standalone jar
        uses: actions/upload-artifact@v4
        with:
          name: JTetris-${{ steps.release.outputs.version }}-jar
          path: target/release/JTetris-${{ steps.release.outputs.version }}.jar
          if-no-files-found: error

  native-app:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon app
            runner: macos-15
            profile: mac
            artifact_suffix: macos-aarch64
            archive_command: macos
          - label: macOS Intel app
            runner: macos-15-intel
            profile: mac
            artifact_suffix: macos-x64
            archive_command: macos
          - label: Windows 11 x64 installer
            runner: windows-2025
            profile: windows
            artifact_suffix: windows-x64
            archive_command: windows
          - label: Windows 11 ARM64 installer
            runner: windows-11-arm
            profile: windows
            artifact_suffix: windows-aarch64
            archive_command: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release version
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install WiX Toolset
        if: matrix.archive_command == 'windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wixHome = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          "$($wixHome.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build native app image
        shell: bash
        run: ./mvnw -Djava.awt.headless=true -P${{ matrix.profile }} clean package

      - name: Stage macOS archive
        if: matrix.archive_command == 'macos'
        shell: bash
        run: |
          mkdir -p target/release
          ditto -c -k --sequesterRsrc --keepParent target/dist/JTetris.app \
            "target/release/JTetris-${{ steps.release.outputs.version }}-${{ matrix.artifact_suffix }}.zip"

      - name: Stage Windows installer
        if: matrix.archive_command == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release
          Copy-Item `
            -Path target/dist/JTetris-*.exe `
            -Destination "target/release/JTetris-${{ steps.release.outputs.version }}-${{ matrix.artifact_suffix }}.exe"

      - name: Upload native app archive
        uses: actions/upload-artifact@v4
        with:
          name: JTetris-${{ steps.release.outputs.version }}-${{ matrix.artifact_suffix }}
          path: target/release/JTetris-${{ steps.release.outputs.version }}-${{ matrix.artifact_suffix }}.*
          if-no-files-found: error

  publish-release:
    name: Publish draft release
    runs-on: ubuntu-latest
    needs:
      - standalone-jar
      - native-app
    if: github.ref_type == 'tag'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release version
        id: release
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/release
          merge-multiple: true

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" target/release/* \
            --draft \
            --title "JTetris ${{ steps.release.outputs.version }}" \
            --notes-file CHANGELOG.md
