name: Spec Task
about: Track one implementation task under a spec
title: "[SPEC] <Spec ID> - <task title>"
labels: ["spec-task"]
body:
  - type: input
    id: spec_id
    attributes:
      label: Spec ID
      placeholder: M2.1-7BAG
    validations:
      required: true

  - type: input
    id: parent_spec_file
    attributes:
      label: Spec File
      placeholder: doc/specs/m2.1-7bag-randomizer.md
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What exact behavior change is expected?
    validations:
      required: true

  - type: textarea
    id: checklist_item
    attributes:
      label: Linked checklist item(s)
      description: Copy exact checklist entries from the spec.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Concrete pass/fail checks.
    validations:
      required: true

  - type: textarea
    id: verification_plan
    attributes:
      label: Verification plan
      description: Include manual and automated checks.
      value: |
        Manual:
        - 

        Automated:
        - mvn clean test
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
      description: Key risk and how to rollback safely.
    validations:
      required: true

